        <a-sphere id="puntoN5C" position="0.2050 0.1050 -0.01" radius="0.03" material="opacity: 0; transparent: true"></a-sphere>
        <a-image id="visualN5C" src="#imagenN5C" position="0.2050 0.1050 0.02" width="0.14" height="0.14" material="transparent: true; opacity: 0" animation__aparecer="property: material.opacity; from: 0; to: 1; dur: 800; easing: easeOutQuad; startEvents: aparecer"></a-image>

        <a-sphere id="puntoN5I2" position="0.2600 0.1950 -0.01" radius="0.03" material="opacity: 0; transparent: true"></a-sphere>
        <a-image id="visualN5I2" src="#imagenN5I2" position="0.2600 0.1950 0.02" width="0.14" height="0.14" material="transparent: true; opacity: 0" animation__aparecer="property: material.opacity; from: 0; to: 1; dur: 800; easing: easeOutQuad; startEvents: aparecer"></a-image>

        <a-sphere id="puntoN5O" position="0.3750 0.2200 -0.01" radius="0.03" material="opacity: 0; transparent: true"></a-sphere>
        <a-image id="visualN5O" src="#imagenN5O" position="0.3750 0.2200 0.02" width="0.14" height="0.14" material="transparent: true; opacity: 0" animation__aparecer="property: material.opacity; from: 0; to: 1; dur: 800; easing: easeOutQuad; startEvents: aparecer"></a-image>

        <a-sphere id="puntoN5Silencio" position="0.3550 0.0950 -0.01" radius="0.04" material="opacity: 0; transparent: true"></a-sphere>
        <a-image id="visualN5Silencio" src="#imagenN5Silencio" position="0.3550 0.0950 0.05" width="0.051" height="0.08" material="transparent: true; opacity: 0" animation__aparecer="property: material.opacity; from: 0; to: 1; dur: 800; easing: easeOutQuad; startEvents: aparecer"></a-image>
    </a-entity>

</a-scene>

<script>
const escena = document.querySelector("a-scene");
let audioDesbloqueado = false;

escena.addEventListener("loaded", function () {
    const canvas = escena.renderer.domElement;
    const camera = escena.camera;

    function q(id) { return document.querySelector(id); }

    function reproducirAudio(id) {
        const audio = q(id);
        if (!audio) return;
        audio.pause();
        audio.currentTime = 0;
        audio.play().catch(function(error) {
            console.log("Error reproduciendo " + id, error);
        });
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // Puntos de todas las páginas
    const objetos = [
        // N1
        q("#puntoN1C").object3D, q("#puntoN1R").object3D, q("#puntoN1I").object3D,
        q("#puntoN1Cri1").object3D, q("#puntoN1Cri2").object3D,
        q("#puntoN1Cri3").object3D, q("#puntoN1Cri4").object3D,

        // N2
        q("#puntoN2L1").object3D, q("#puntoN2U1").object3D, q("#puntoN2N").object3D,
        q("#puntoN2A").object3D, q("#puntoN2Luna").object3D,
        q("#puntoN2L2").object3D, q("#puntoN2U2").object3D,
        q("#puntoN2Z").object3D, q("#puntoN2Luz").object3D,

        // N3
        q("#puntoN3M").object3D, q("#puntoN3I").object3D, q("#puntoN3E").object3D,
        q("#puntoN3D").object3D, q("#puntoN3O").object3D, q("#puntoN3Miedo").object3D,

        // N4
        q("#puntoN4N").object3D, q("#puntoN4O").object3D, q("#puntoN4C").object3D,
        q("#puntoN4H").object3D, q("#puntoN4E").object3D, q("#puntoN4Noche").object3D,
        q("#puntoN4Ji1").object3D, q("#puntoN4Ji2").object3D, q("#puntoN4Ji3").object3D,

        // N5
        q("#puntoN5S").object3D, q("#puntoN5I1").object3D, q("#puntoN5L").object3D,
        q("#puntoN5E").object3D, q("#puntoN5N").object3D, q("#puntoN5C").object3D,
        q("#puntoN5I2").object3D, q("#puntoN5O").object3D, q("#puntoN5Silencio").object3D
    ];

    let pasoN1 = 0;
    let pasoN2Luna = 0;
    let pasoN2Luz = 0;
    let pasoN3 = 0;
    let pasoN4 = 0;
    let pasoN5 = 0;

    canvas.addEventListener("pointerdown", function(evento) {
        if (!audioDesbloqueado) audioDesbloqueado = true;

        const rect = canvas.getBoundingClientRect();
        mouse.x = ((evento.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((evento.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const intersecciones = raycaster.intersectObjects(objetos, true);
        if (intersecciones.length === 0) return;

        const el = intersecciones[0].object.el;
        if (!el) return;
        const id = el.id;

        // ========================= N1 =========================
        if (id === "puntoN1C") {
            reproducirAudio("#audioN1C");
            if (pasoN1 === 0) { q("#visualN1R").emit("aparecer"); pasoN1 = 1; }
        }
        else if (id === "puntoN1R") {
            if (pasoN1 >= 1) reproducirAudio("#audioN1R");
            if (pasoN1 === 1) { q("#visualN1I").emit("aparecer"); pasoN1 = 2; }
        }
        else if (id === "puntoN1I") {
            if (pasoN1 >= 2) reproducirAudio("#audioN1I");
            if (pasoN1 === 2) { q("#visualN1Cri1").emit("aparecer"); pasoN1 = 3; }
        }
        else if (id === "puntoN1Cri1") {
            if (pasoN1 >= 3) reproducirAudio("#audioN1CriCri");
            if (pasoN1 === 3) { q("#visualN1Cri2").emit("aparecer"); pasoN1 = 4; }
        }
        else if (id === "puntoN1Cri2") {
            if (pasoN1 >= 4) reproducirAudio("#audioN1CriCri");
            if (pasoN1 === 4) { q("#visualN1Cri3").emit("aparecer"); pasoN1 = 5; }
        }
        else if (id === "puntoN1Cri3") {
            if (pasoN1 >= 5) reproducirAudio("#audioN1CriCri");
            if (pasoN1 === 5) { q("#visualN1Cri4").emit("aparecer"); pasoN1 = 6; }
        }
        else if (id === "puntoN1Cri4") {
            if (pasoN1 >= 6) reproducirAudio("#audioN1CriCri");
        }

        // ========================= N2 =========================
        else if (id === "puntoN2L1") {
            reproducirAudio("#audioN2L");
            if (pasoN2Luna === 0) { q("#visualN2U1").emit("aparecer"); pasoN2Luna = 1; }
        }
        else if (id === "puntoN2U1") {
            if (pasoN2Luna >= 1) reproducirAudio("#audioN2U");
            if (pasoN2Luna === 1) { q("#visualN2N").emit("aparecer"); pasoN2Luna = 2; }
        }
        else if (id === "puntoN2N") {
            if (pasoN2Luna >= 2) reproducirAudio("#audioN2N");
            if (pasoN2Luna === 2) { q("#visualN2A").emit("aparecer"); pasoN2Luna = 3; }
        }
        else if (id === "puntoN2A") {
            if (pasoN2Luna >= 3) reproducirAudio("#audioN2A");
            if (pasoN2Luna === 3) { q("#visualN2Luna").emit("aparecer"); pasoN2Luna = 4; }
        }
        else if (id === "puntoN2Luna") {
            if (pasoN2Luna >= 4) reproducirAudio("#audioN2Luna");
        }
        else if (id === "puntoN2L2") {
            reproducirAudio("#audioN2L");
            if (pasoN2Luz === 0) { q("#visualN2U2").emit("aparecer"); pasoN2Luz = 1; }
        }
        else if (id === "puntoN2U2") {
            if (pasoN2Luz >= 1) reproducirAudio("#audioN2U");
            if (pasoN2Luz === 1) { q("#visualN2Z").emit("aparecer"); pasoN2Luz = 2; }
        }
        else if (id === "puntoN2Z") {
            if (pasoN2Luz >= 2) reproducirAudio("#audioN2Z");
            if (pasoN2Luz === 2) { q("#visualN2Luz").emit("aparecer"); pasoN2Luz = 3; }
        }
        else if (id === "puntoN2Luz") {
            if (pasoN2Luz >= 3) reproducirAudio("#audioN2Luz");
        }

        // ========================= N3 =========================
        else if (id === "puntoN3M") {
            reproducirAudio("#audioN3M");
            if (pasoN3 === 0) { q("#visualN3I").emit("aparecer"); pasoN3 = 1; }
        }
        else if (id === "puntoN3I") {
            if (pasoN3 >= 1) reproducirAudio("#audioN3I");
            if (pasoN3 === 1) { q("#visualN3E").emit("aparecer"); pasoN3 = 2; }
        }
        else if (id === "puntoN3E") {
            if (pasoN3 >= 2) reproducirAudio("#audioN3E");
            if (pasoN3 === 2) { q("#visualN3D").emit("aparecer"); pasoN3 = 3; }
        }
        else if (id === "puntoN3D") {
            if (pasoN3 >= 3) reproducirAudio("#audioN3D");
            if (pasoN3 === 3) { q("#visualN3O").emit("aparecer"); pasoN3 = 4; }
        }
        else if (id === "puntoN3O") {
            if (pasoN3 >= 4) reproducirAudio("#audioN3O");
            if (pasoN3 === 4) { q("#visualN3Miedo").emit("aparecer"); pasoN3 = 5; }
        }
        else if (id === "puntoN3Miedo") {
            if (pasoN3 >= 5) reproducirAudio("#audioN3Miedo");
        }

        // ========================= N4 =========================
        else if (id === "puntoN4N") {
            reproducirAudio("#audioN4N");
            if (pasoN4 === 0) { q("#visualN4O").emit("aparecer"); pasoN4 = 1; }
        }
        else if (id === "puntoN4O") {
            if (pasoN4 >= 1) reproducirAudio("#audioN4O");
            if (pasoN4 === 1) { q("#visualN4C").emit("aparecer"); pasoN4 = 2; }
        }
        else if (id === "puntoN4C") {
            if (pasoN4 >= 2) reproducirAudio("#audioN4C");
            if (pasoN4 === 2) { q("#visualN4H").emit("aparecer"); pasoN4 = 3; }
        }
        else if (id === "puntoN4H") {
            if (pasoN4 >= 3) reproducirAudio("#audioN4H");
            if (pasoN4 === 3) { q("#visualN4E").emit("aparecer"); pasoN4 = 4; }
        }
        else if (id === "puntoN4E") {
            if (pasoN4 >= 4) reproducirAudio("#audioN4E");
            if (pasoN4 === 4) {
                // Se conserva el método especial del N4 original.
                q("#visualN4Noche").setAttribute("material", "transparent: true; opacity: 1");
                pasoN4 = 5;
            }
        }
        else if (id === "puntoN4Noche") {
            if (pasoN4 >= 5) reproducirAudio("#audioN4Noche");
        }
        else if (id === "puntoN4Ji1" || id === "puntoN4Ji2" || id === "puntoN4Ji3") {
            reproducirAudio("#audioN4Ji");
        }

        // ========================= N5 =========================
        else if (id === "puntoN5S") {
            reproducirAudio("#audioN5S");
            if (pasoN5 === 0) { q("#visualN5I1").emit("aparecer"); pasoN5 = 1; }
        }
        else if (id === "puntoN5I1") {
            if (pasoN5 >= 1) reproducirAudio("#audioN5I");
            if (pasoN5 === 1) { q("#visualN5L").emit("aparecer"); pasoN5 = 2; }
        }
        else if (id === "puntoN5L") {
            if (pasoN5 >= 2) reproducirAudio("#audioN5L");
            if (pasoN5 === 2) { q("#visualN5E").emit("aparecer"); pasoN5 = 3; }
        }
        else if (id === "puntoN5E") {
            if (pasoN5 >= 3) reproducirAudio("#audioN5E");
            if (pasoN5 === 3) { q("#visualN5N").emit("aparecer"); pasoN5 = 4; }
        }
        else if (id === "puntoN5N") {
            if (pasoN5 >= 4) reproducirAudio("#audioN5N");
            if (pasoN5 === 4) { q("#visualN5C").emit("aparecer"); pasoN5 = 5; }
        }
        else if (id === "puntoN5C") {
            if (pasoN5 >= 5) reproducirAudio("#audioN5C");
            if (pasoN5 === 5) { q("#visualN5I2").emit("aparecer"); pasoN5 = 6; }
        }
        else if (id === "puntoN5I2") {
            if (pasoN5 >= 6) reproducirAudio("#audioN5I");
            if (pasoN5 === 6) { q("#visualN5O").emit("aparecer"); pasoN5 = 7; }
        }
        else if (id === "puntoN5O") {
            if (pasoN5 >= 7) reproducirAudio("#audioN5O");
            if (pasoN5 === 7) { q("#visualN5Silencio").emit("aparecer"); pasoN5 = 8; }
        }
        else if (id === "puntoN5Silencio") {
            if (pasoN5 >= 8) reproducirAudio("#audioN5Silencio");
        }
    });
});
</script>

</body>
</html>
