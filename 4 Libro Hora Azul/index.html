                audio.currentTime = 0;

                audio.play().catch(function (error) {

                    console.log(
                        "Error reproduciendo audio:",
                        error
                    );

                });
            }


            let parpadeando = false;

            let temporizadorParpadeo = null;


            function parpadearNina() {

                if (parpadeando) return;

                parpadeando = true;


                visualNinaParpadeo.setAttribute(
                    "visible",
                    true
                );


                temporizadorParpadeo =
                    setTimeout(function () {

                        visualNinaParpadeo.setAttribute(
                            "visible",
                            false
                        );

                        parpadeando = false;

                        temporizadorParpadeo = null;

                    }, 220);
            }

                "#h5_destello3",
                "#h5_destello4"

            ];


            let intervaloAnimacion = null;

            let indiceFotograma = 0;


            function mostrarFotograma() {

                visualDestellos.setAttribute(
                    "src",
                    fotogramasDestellos[indiceFotograma]
                );

                indiceFotograma =
                    (indiceFotograma + 1) %
                    fotogramasDestellos.length;
            }


            function detenerAnimacionDestellos() {

                if (intervaloAnimacion !== null) {

                    clearInterval(intervaloAnimacion);
                }

                intervaloAnimacion = null;

                visualDestellos.removeAttribute(
                    "animation__flotar"
                );

                visualDestellos.setAttribute(
                    "position",
                    "0 0 0"
                );

                visualDestellos.setAttribute(
                    "visible",
                    false
                );

                visualDestellos.setAttribute(
                    "material",
                    "opacity",
                    0
                );
            }


            function iniciarAnimacionDestellos() {

                detenerAnimacionDestellos();

                indiceFotograma = 0;

                visualDestellos.setAttribute(
                    "visible",
                    true
                );

                visualDestellos.setAttribute(
                    "material",
                    "opacity",
                    0.85
                );

                visualDestellos.setAttribute(
                    "animation__flotar",
                    "property: position; from: 0 -0.015 0; to: 0 0.015 0; dur: 1400; dir: alternate; loop: true; easing: easeInOutSine"
                );

                mostrarFotograma();


                intervaloAnimacion =

                        200
                    );

                iniciarAnimacionDestellos();

            audioAbuela.addEventListener(

            );

                );
            }


            function iniciarDestellosNina() {

                detenerDestellosNina();

                indiceDestellosNina = 0;

                visualDestellosNina.setAttribute(
                    "visible",
                    true
                );


                visualDestellosNina.setAttribute(
                    "animation__flotar",
                    "property: position; from: 0 -0.012 0; to: 0 0.012 0; dur: 800; dir: alternate; loop: true; easing: easeInOutSine"
                );

                mostrarFotogramaNina();


                intervaloDestellosNina =
                    setInterval(
                        mostrarFotogramaNina,
                        duracionFotogramaNina
                    );


                temporizadorDestellosNina =
                    setTimeout(
                        detenerDestellosNina,
                        1200
                    );
            }



            function reaccionNina() {


                reproducirAudio(audioNina);


                parpadearNina();


                iniciarDestellosNina();
            }


            const raycaster =
                new THREE.Raycaster();

            const mouse =
                new THREE.Vector2();


            canvas.addEventListener(
                "pointerdown",
                function (evento) {


                    if (!marcadorHA5.object3D.visible) {

                        return;
                    }


                    const rect =
                        canvas.getBoundingClientRect();

                    mouse.x =
                        ((evento.clientX - rect.left) /
                        rect.width) * 2 - 1;

                    mouse.y =
                        -((evento.clientY - rect.top) /
                        rect.height) * 2 + 1;


                    raycaster.setFromCamera(
                        mouse,
                        camera
                    );


                    const intersecciones =
                        raycaster.intersectObjects(
                            [
                                puntoAbuela.object3D,
                                puntoNina.object3D
                            ],
                            true
                        );

                    if (intersecciones.length === 0) {

                        return;
                    }

                    const tocado =
                        intersecciones[0].object.el;



                    if (tocado.id === "h5_puntoAbuela") {

                        hablarAbuela();

                    }


                    else if (tocado.id === "h5_puntoNina") {

                        reaccionNina();

                    }
                }
            );


            marcadorHA5.addEventListener(
                "targetLost",
                function () {


                    detenerAnimacionDestellos();


                    detenerDestellosNina();


                    if (temporizadorParpadeo !== null) {

                        clearTimeout(temporizadorParpadeo);
                    }

                    temporizadorParpadeo = null;

                    parpadeando = false;

                    visualNinaParpadeo.setAttribute(
                        "visible",
                        false
                    );


                    audioAbuela.pause();

                    audioNina.pause();
                }
            );

        });

    
  })();
  </script>
