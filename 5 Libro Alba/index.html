<script>
// ===== Página A1 =====
(function () {


        const escena =
            document.querySelector("a-scene");

        escena.addEventListener("loaded", function () {

            const canvas =
                escena.renderer.domElement;

            const camera =
                escena.camera;

            const puntoLUZ =
                document.querySelector("#a1_puntoLUZ");

            const puntoMIEDO =
                document.querySelector("#a1_puntoMIEDO");

            const puntoRISAS =
                document.querySelector("#a1_puntoRISAS");

            const puntoOVNI =
                document.querySelector("#a1_puntoOVNI");

            const visualOVNI =
                document.querySelector("#a1_visualOVNI");

            const marcadorA1 =
                document.querySelector("#a1_marcadorA1");

            const audioOVNI =
                document.querySelector("#a1_audioOVNI");


            function reproducirAudio(id) {

                const audio =
                    document.querySelector(id);

                if (!audio) {
                    console.error(
                        "No se encontró el audio:",
                        id
                    );
                    return;
                }

                audio.pause();

                audio.currentTime = 0;

                audio.play().catch(function (error) {

                    console.log(
                        "Error reproduciendo " + id,
                        error
                    );

                });
            }


            function reproducirOVNI() {

                audioOVNI.pause();

                audioOVNI.currentTime = 0;

                audioOVNI.play().catch(function (error) {

                    console.log(
                        "Error reproduciendo OVNI:",
                        error
                    );

                });
            }


            const raycaster =
                new THREE.Raycaster();

            const mouse =
                new THREE.Vector2();


            let pasoAlba = 0;


            canvas.addEventListener(
                "pointerdown",
                function (evento) {


                    if (!marcadorA1.object3D.visible) {
                        return;
                    }


                    const rect =
                        canvas.getBoundingClientRect();

                    mouse.x =
                        ((evento.clientX - rect.left) /
                        rect.width) * 2 - 1;

                    mouse.y =
                        -((evento.clientY - rect.top) /
                        rect.height) * 2 + 1;



                    raycaster.setFromCamera(
                        mouse,
                        camera
                    );



                    const objetos = [

                        puntoLUZ.object3D,
                        puntoMIEDO.object3D,
                        puntoRISAS.object3D,
                        puntoOVNI.object3D

                    ];

                    const intersecciones =
                        raycaster.intersectObjects(
                            objetos,
                            true
                        );


                    if (intersecciones.length === 0) {
                        return;
                    }


                    const objetoTocado =
                        intersecciones[0].object.el;

                    if (!objetoTocado) {
                        return;
                    }

                    if (
                        objetoTocado.id === "a1_puntoLUZ"
                    ) {

                        reproducirAudio("#a1_audioLUZ");

                        if (pasoAlba === 0) {

                            document.querySelector("#a1_visualMIEDO")
                                .emit("aparecer");

                            pasoAlba = 1;
                        }
                    }


                    else if (
                        objetoTocado.id === "a1_puntoMIEDO"
                    ) {

                        if (pasoAlba >= 1) {
